# Builds the BORG AI model server image (infra/ollama-worker) and pushes it to GHCR for the Runpod
# Serverless endpoint. Runs on GitHub's machines, so nothing is built or downloaded locally.
name: ollama-worker image

on:
  push:
    paths:
      - infra/ollama-worker/**
      - .github/workflows/ollama-worker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/ollama-worker
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/borg-ollama-worker:latest
            ghcr.io/${{ github.repository_owner }}/borg-ollama-worker:${{ github.sha }}
      # The pushed image must list the model without downloading anything (no GPU needed).
      - name: Check the model is baked in
        run: |
          docker run --rm --entrypoint /bin/sh ghcr.io/${{ github.repository_owner }}/borg-ollama-worker:${{ github.sha }} -c '
            echo "OLLAMA_MODELS=$OLLAMA_MODELS"; du -sh "$OLLAMA_MODELS" 2>&1; find "$OLLAMA_MODELS" -maxdepth 3 | head -20
            ollama serve > /tmp/serve.log 2>&1 & sleep 5
            grep "total blobs" /tmp/serve.log; ollama list
            ollama list | grep -q "$MODEL"'
